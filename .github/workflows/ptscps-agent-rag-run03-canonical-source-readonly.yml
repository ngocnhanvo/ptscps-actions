name: PTSCPS RUN03 canonical source recall guarded read-only QA
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-rag-run03-canonical-source-readonly.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  canonical-source-recall:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): rerun canonical RUN03 source recall with Page evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: ca980ff157d1b061ecf24d2fb9cc93bce372675b
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/source-commit-actions
          ref: main
          path: source-control
          persist-credentials: false
      - name: Validate pinned source and read-only QA scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-rag-run03-canonical-source-readonly.ready)" = 'PTSCPS_RUN03_CANONICAL_SOURCE source=ca980ff157d1b061ecf24d2fb9cc93bce372675b gate=0.95'
          test "$(git -C source-php rev-parse HEAD)" = 'ca980ff157d1b061ecf24d2fb9cc93bce372675b'
          php -l source-php/wp-content/mu-plugins/esc-agent.php
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeInventory.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-retrieval-readonly-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-source-locale-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-collection-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py
          node --check scripts/ptscps-agent-rag-run03-canonical-source.mjs
      - name: Deploy PHP knowledge diagnostic through protected FTPS readback
        env:
          PTSCPS_AGENT_KNOWLEDGE_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Measure canonical source recall on production
        env:
          PTSCPS_SOURCE_SHA: ca980ff157d1b061ecf24d2fb9cc93bce372675b
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-agent-rag-run03-canonical-source.mjs
      - name: Upload sanitized aggregate and encrypted private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-rag-run03-canonical-source-readonly
          path: |
            audit/ptscps-agent-rag-run03-canonical-source-summary.json
            audit/ptscps-agent-rag-run03-canonical-source-private.cms
          if-no-files-found: warn
          retention-days: 14
