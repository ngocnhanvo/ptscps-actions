name: PTSCPS Agent client collection grounded PHP release
on:
  push:
    branches: [main]
    paths:
      - audit/ptscps-agent-client-collection-release.ready
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): guarded client collection scoring PHP'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned PHP source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify exact source and independent bilingual collection regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-client-collection-release.ready)" = 'PTSCPS_AGENT_CLIENT_COLLECTION_RELEASE source=6aae17292fbaa068aa4e0b81171755216023ae5e mode=php-only'
          test "$(git -C source-php rev-parse HEAD)" = '6aae17292fbaa068aa4e0b81171755216023ae5e'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeIndex.php
          php -l source-php/wp-content/mu-plugins/tests/esc-agent-published-collection-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-collection-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-source-registry-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-retrieval-context-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py scripts/ptscps-agent-factual-acceptance.py
          grep -Fq 'PTSCPS_AGENT_RETRIEVAL_CONTEXT_ONLY' scripts/ptscps-php-live-release.py
      - name: Atomic one-file PHP FTPS release and SHA-256 readback
        shell: bash
        env:
          PTSCPS_AGENT_RETRIEVAL_CONTEXT_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/ptscps-php-live-release.py
      - name: Verify all 4 VI-EN source-label collections on production
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: python3 scripts/ptscps-agent-factual-acceptance.py
      - name: Preserve sanitized factual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-agent-client-collection-live-qa
          path: audit/ptscps-agent-factual-acceptance-report.json
          if-no-files-found: warn
          retention-days: 10
      - name: Confirm PHP-only scope
        run: echo PTSCPS_CLIENT_COLLECTION_PHP_ONLY=PASS
