name: PTSCPS second-row source identity and row-order read-only diagnosis
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-ordinal-source-audit.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  guarded-php:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): scoped second-row source selection diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: 96ffab231774577be3499451087110c055e3ae2d
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify release source, syntax and existing regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-ordinal-source-audit.ready)" = 'PTSCPS_ORDINAL_READONLY source=96ffab231774577be3499451087110c055e3ae2d cases=2'
          test "$(git -C source-php rev-parse HEAD)" = '96ffab231774577be3499451087110c055e3ae2d'
          php -l source-php/wp-content/mu-plugins/esc-agent.php
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeInventory.php
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeIndex.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-original-query-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-source-registry-test.php
          node --check scripts/ptscps-agent-ordinal-source-audit.mjs
          python3 -m py_compile scripts/ptscps-php-live-release.py
      - name: Upload only changed PHP runtime files (other files verified unchanged)
        env:
          PTSCPS_AGENT_KNOWLEDGE_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
  source-attribution:
    needs: [guarded-php]
    if: needs.guarded-php.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright driver (Chromium preinstalled)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Authenticate and inspect only two original failed positional queries
        env:
          PTSCPS_SOURCE_SHA: 96ffab231774577be3499451087110c055e3ae2d
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-agent-ordinal-source-audit.mjs
      - name: Publish sanitized source selection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-agent-ordinal-source-audit
          path: audit/ptscps-agent-ordinal-source-audit-summary.json
          if-no-files-found: warn
          retention-days: 7
