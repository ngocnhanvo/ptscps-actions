name: PTSCPS EN fact HTTP 503 provider/skill trace (one request)
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-en-fact-trace.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-en-fact-trace-one
  cancel-in-progress: false
jobs:
  trace:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): attribute new English factual HTTP 503'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard exact one-case request and source
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-en-fact-trace.ready)" = 'PTSCPS_EN_FACT_TRACE source=cb612e024a946b3d87b775a31f8ca70a48aae331 request=1'
          python3 -m py_compile scripts/ptscps-agent-run04-en-503-trace.py scripts/ptscps-agent-en-fact-trace.py
      - name: Make one EN factual request and read only its opt-in telemetry
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-en-fact-trace.py
      - name: Retain sanitized single-request result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-agent-en-fact-trace-summary
          path: audit/ptscps-agent-en-fact-trace-summary.json
          if-no-files-found: warn
          retention-days: 7
