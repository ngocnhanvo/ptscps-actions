name: PTSCPS RAG RUN03 source-grounded English metadata probe
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-rag-run03-source-probe.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  guarded-source-probe:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): RUN03 English subject QA guarded PHP'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: 5b9e455ec9bd64368c57a9d2684a81a86adb5c7f
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify pinned PHP, guards and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-rag-run03-source-probe.ready)" = 'PTSCPS_RUN03_SOURCE_PROBE source=5b9e455ec9bd64368c57a9d2684a81a86adb5c7f'
          test "$(git -C source-php rev-parse HEAD)" = '5b9e455ec9bd64368c57a9d2684a81a86adb5c7f'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeInventory.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-retrieval-readonly-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-retrieval-stage-regression-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-collection-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-source-locale-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py
          node --check scripts/ptscps-agent-rag-run03-source-probe.mjs
      - name: Guarded PHP-only FTPS release with SHA-256 readback
        env:
          PTSCPS_AGENT_KNOWLEDGE_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright driver (Chromium preinstalled)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Compare real published English metadata via admin read-only endpoint
        env:
          PTSCPS_SOURCE_SHA: 5b9e455ec9bd64368c57a9d2684a81a86adb5c7f
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-agent-rag-run03-source-probe.mjs
      - name: Upload aggregate-only source probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-rag-run03-source-probe-summary
          path: audit/ptscps-agent-rag-run03-source-probe-summary.json
          if-no-files-found: warn
          retention-days: 14
