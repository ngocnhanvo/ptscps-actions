name: PTSCPS current ordinal evidence and LLM path attribution
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-current-ordinal-attribution.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-current-ordinal-attribution
  cancel-in-progress: false
jobs:
  attribute:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): current ordinal evidence attribution'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate bounded audit source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-current-ordinal-attribution.ready)" = 'PTSCPS_CURRENT_ORDINAL_ATTRIBUTION php=4ab2eddbebeeef730dcc1d9c69bab03b427392a3 cases=3'
          python3 -m py_compile scripts/ptscps-agent-ordinal-live-attribution.py scripts/ptscps-agent-client-routing-trace.py scripts/ptscps-agent-independent-fact-sample.py
          node --check scripts/ptscps-agent-ordinal-source-audit.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Read-only source attribution for exact second-service cases
        env:
          PTSCPS_SOURCE_SHA: 4ab2eddbebeeef730dcc1d9c69bab03b427392a3
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-agent-ordinal-source-audit.mjs
      - name: One-shot opt-in path trace for three current VI misses
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-ordinal-live-attribution.py
      - name: Upload sanitized attribution only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-current-ordinal-attribution
          path: |
            audit/ptscps-agent-ordinal-source-audit-summary.json
            audit/ptscps-agent-ordinal-live-attribution-summary.json
          if-no-files-found: warn
          retention-days: 7
