name: PTSCPS missing service ESC Table backfill (guarded)
on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-service-esc-backfill.ready'
permissions:
  contents: read
concurrency:
  group: ptscps-service-esc-table-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate repository and exact configured origins
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os,re
          vals={}
          for line in os.environ.get('ENV_FILE','').splitlines():
              m=re.fullmatch(r'\s*(?:export\s+)?(WC_URL|WC_URL_CLIENT)\s*=\s*(.*?)\s*',line)
              if m:vals[m[1]]=m[2].strip().strip('"\'')
          assert vals.get('WC_URL')=='https://admin-ptscps.thegioihosting.io.vn'
          assert vals.get('WC_URL_CLIENT')=='https://ptscps.thegioihosting.io.vn'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('WP_ORIGIN='+vals['WC_URL']+'\nCLIENT_ORIGIN='+vals['WC_URL_CLIENT']+'\n')
          PY
      - name: Install Playwright driver
        run: npm install --prefix .qa --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Check migration script syntax
        run: node --check scripts/ptscps-service-esc-backfill.mjs
      - name: Create only missing canonical ESC Tables with readback verification
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-service-esc-backfill.mjs
