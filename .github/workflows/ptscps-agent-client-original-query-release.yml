name: PTSCPS original first-client query guarded PHP release and two-case QA
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-client-original-query-release.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  guarded-php:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): original-question PHP three-file release and two-case QA'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: 4f8e755c6a9f11c3b1fd22b2bfc5fc8fa7a0c1ab
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Validate exact PHP source and relevant unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-client-original-query-release.ready)" = 'PTSCPS_CLIENT_ORIGINAL_QUERY source=4f8e755c6a9f11c3b1fd22b2bfc5fc8fa7a0c1ab files=3 qa=2'
          test "$(git -C source-php rev-parse HEAD)" = '4f8e755c6a9f11c3b1fd22b2bfc5fc8fa7a0c1ab'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeRetriever.php
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeIndex.php
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Core/SkillExecutor.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-original-query-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-collection-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-source-registry-test.php
          python3 -m py_compile scripts/ptscps-agent-first-client-only-retest.py scripts/ptscps-php-live-release.py
      - name: Deploy only the three changed PHP runtime files via protected FTPS with readback
        env:
          PTSCPS_AGENT_ORDINAL_ORIGINAL_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
  postrelease-two-client-failures:
    needs: [guarded-php]
    if: needs.guarded-php.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck only the two original failed client positions
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: python3 scripts/ptscps-agent-first-client-only-retest.py
      - name: Store sanitized QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-first-client-original-query-postrelease-qa
          path: audit/ptscps-agent-first-client-only-summary.json
          if-no-files-found: warn
          retention-days: 7
