name: PTSCPS About pages preflight audit (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-about-pages-preflight.ready'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve configured origins
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=dict(re.findall(r'^\s*(WC_URL|WC_URL_CLIENT)\s*=\s*(.+)\s*$',os.environ.get('ENV_FILE',''),re.M))
          def origin(name):
              p=urlsplit(vals.get(name,'').strip().strip('"').strip("'"))
              if p.scheme!='https' or not p.hostname or p.path not in ('','/') or p.query or p.fragment or p.username or p.password or p.port not in (None,443):
                  raise SystemExit('Invalid '+name)
              return 'https://'+p.hostname
          wp,front=origin('WC_URL'),origin('WC_URL_CLIENT')
          if wp==front: raise SystemExit('WordPress/frontend origins collide')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('WP_ORIGIN='+wp+'\n')
              f.write('FRONT_ORIGIN='+front+'\n')
          print('ABOUT_PREFLIGHT_ORIGINS=PASS')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit target Pages and Header menu without writes
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-about-pages-preflight.mjs
