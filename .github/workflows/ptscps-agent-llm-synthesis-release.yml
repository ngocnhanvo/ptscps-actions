name: PTSCPS Agent grounded LLM synthesis PHP-only release
on:
  push:
    branches: [main]
    paths:
      - audit/ptscps-agent-llm-synthesis-release.ready
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): grounded LLM synthesis PHP only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PTSCPS Actions release scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout PHP source with pinned HEAD
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify pin, PHP syntax, and collection regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-llm-synthesis-release.ready)" = 'PTSCPS_AGENT_LLM_SYNTHESIS_RELEASE source=9111a87ce49baf91e37c8b7913d9f6ec78cab84d mode=php-only'
          test "$(git -C source-php rev-parse HEAD)" = '9111a87ce49baf91e37c8b7913d9f6ec78cab84d'
          for f in \
            wp-content/mu-plugins/esc-agent/src/Core/KnowledgeAwarePlanner.php \
            wp-content/mu-plugins/esc-agent/src/Core/TelemetryPlanner.php \
            wp-content/mu-plugins/esc-agent/src/Core/AgentSynthesisPrompt.php \
            wp-content/mu-plugins/esc-agent/src/Skills/KnowledgeSearchSkill.php; do
            php -l "source-php/$f"
          done
          php source-php/wp-content/mu-plugins/tests/esc-agent-complete-collection-summary-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-routing-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-collection-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py
          grep -Fq 'PTSCPS_AGENT_LLM_SYNTHESIS_ONLY' scripts/ptscps-php-live-release.py
      - name: Protected four-file PHP FTPS with SHA-256 readback and rollback
        shell: bash
        env:
          PTSCPS_AGENT_LLM_SYNTHESIS_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
      - name: Verify real VI and EN Agent answers and no column-label leakage
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, uuid
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          vals=[]
          for line in os.environ['ENV_FILE'].splitlines():
              line=line.strip().removeprefix('export ')
              if line.startswith('WC_URL_CLIENT='):
                  vals.append(line.split('=',1)[1].strip().strip('"\''))
          assert len(vals)==1
          u=urlsplit(vals[0]); assert u.scheme=='https' and u.hostname=='ptscps.thegioihosting.io.vn' and u.path in ('','/')
          assert not u.username and not u.password and not u.query and not u.fragment
          endpoint=u.scheme+'://'+u.netloc+'/api/agent/chat'
          cases=[
            ('vi_activities','vi','LĨNH VỰC HOẠT ĐỘNG là gì'),
            ('vi_services','vi','Những dịch vụ hoạt động chính của PTSC là gì?'),
            ('en_activities','en','What are PTSC’s main areas of operation?'),
            ('en_services','en','Which service areas does PTSC provide?'),
          ]
          for key,lang,question in cases:
              body=json.dumps({'message':question,'language':lang,'sessionId':str(uuid.uuid4())},ensure_ascii=False).encode()
              req=Request(endpoint,data=body,method='POST',headers={'Content-Type':'application/json','Accept':'application/json'})
              with urlopen(req,timeout=90) as resp:
                  assert resp.status==200, 'Agent transport failure'
                  data=json.loads(resp.read(262144))
              reply=data.get('reply','') if isinstance(data,dict) else ''
              assert isinstance(reply,str), 'Missing reply'
              failed='chưa thể tổng hợp' in reply.lower() or 'cannot summarize' in reply.lower() or 'cannot process' in reply.lower()
              header=bool(re.search(r'(?im)^\s*(?:[-*•]\s*)?(?:tiêu đề|title)\s*$',reply))
              passed=len(reply.strip())>=80 and not failed and not header
              print('PTSCPS_AGENT_LLM_SYNTHESIS_QA '+json.dumps({'case':key,'pass':passed,'reply_chars':len(reply),'header_leak':header,'provider_error':failed}))
              if not passed: raise SystemExit('Grounded LLM production verification failed')
          print('PTSCPS_AGENT_LLM_SYNTHESIS_PRODUCTION=PASS 4/4')
          PYCODE
      - name: Assert PHP-only release; Astro and content unchanged
        run: echo PTSCPS_AGENT_LLM_SYNTHESIS_PHP_ONLY=PASS
