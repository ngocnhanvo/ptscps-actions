name: PTSCPS live WordPress SEO file diagnosis (read-only)
on:
  push:
    branches: [main]
    paths:
      - audit/ptscps-seo-live-audit.ready
permissions:
  contents: read
jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate targets and inspect public SEO REST only
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=dict(re.findall(r'^\s*(WC_URL|WC_URL_CLIENT)\s*=\s*(.+)\s*$',os.environ.get('ENV_FILE',''),re.M))
          urls=[]
          for key in ('WC_URL','WC_URL_CLIENT'):
            p=urlsplit(vals.get(key,'').strip().strip('"\''))
            if p.scheme!='https' or not p.hostname or p.path not in ('','/') or p.query or p.fragment or p.username or p.password or p.port not in (None,443):raise SystemExit('Bad '+key)
            urls.append('https://'+p.hostname)
          if urls[0]==urls[1]:raise SystemExit('Origins overlap')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('WP_ORIGIN='+urls[0]+'\nCLIENT_ORIGIN='+urls[1]+'\n')
          PY
      - name: Read canonical SEO data (read-only)
        run: node scripts/ptscps-seo-live-audit.mjs
