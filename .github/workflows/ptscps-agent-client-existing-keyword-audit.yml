name: PTSCPS existing two first-customer tool-keyword read-only audit
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-client-existing-keyword.ready]
permissions:
  contents: read
jobs:
  existing-tool-keyword:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): compare two existing first-customer tool keywords'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify existing trace scope without new LLM calls
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-client-existing-keyword.ready)" = 'PTSCPS_CLIENT_KEYWORD_TRACE run=41601228430 readonly=2 count=2'
          python3 -m py_compile scripts/ptscps-agent-client-existing-keyword-audit.py scripts/ptscps-agent-fact-intent-grounded.py
      - name: Read only the two existing opt-in FTPS traces
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-client-existing-keyword-audit.py
      - name: Save Boolean-only historical keyword comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-existing-two-keyword-flags
          path: audit/ptscps-agent-client-existing-keyword-summary.json
          if-no-files-found: warn
          retention-days: 7
