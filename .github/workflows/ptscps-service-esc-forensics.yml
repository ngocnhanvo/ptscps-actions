name: PTSCPS service ESC Table state forensic (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-service-esc-forensics.ready'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify configured WordPress origin
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os,re
          s=os.environ.get('ENV_FILE','')
          assert re.search(r'^\s*WC_URL\s*=\s*["\']?https://admin-ptscps\.thegioihosting\.io\.vn["\']?\s*$',s,re.M)
          PY
      - name: Install Playwright driver and validate syntax
        run: |
          npm install --prefix .qa --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
          node --check scripts/ptscps-service-esc-forensics.mjs
      - name: Read live TablePress state without any writes
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-service-esc-forensics.mjs
