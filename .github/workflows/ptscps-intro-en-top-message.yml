name: PTSCPS EN introduction Top Message sample
on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-intro-en-top-message.ready'
permissions:
  contents: read
jobs:
  cms-native-build-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve WordPress and frontend origins
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=dict(re.findall(r'^\s*(?:export\s+)?(WC_URL|WC_URL_CLIENT)\s*=\s*(.+)\s*$',os.environ.get('ENV_FILE',''),re.M))
          def origin(key):
              url=urlsplit(vals.get(key,'').strip().strip('"\''))
              if url.scheme!='https' or not url.hostname or url.path not in ('','/') or url.port not in (None,443) or url.username or url.password or url.query or url.fragment:
                  raise SystemExit('INVALID_ORIGIN '+key)
              return 'https://'+url.hostname
          wp,front=origin('WC_URL'),origin('WC_URL_CLIENT')
          if wp==front:raise SystemExit('ORIGIN_COLLISION')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('WP_ORIGIN='+wp+'\nFRONT_ORIGIN='+front+'\n')
          print('EN_TOP_ORIGINS=PASS')
          PY
      - name: Install Playwright driver (Chromium preinstalled)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Create English Top Message via native WordPress and build via plugin
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-intro-en-top-message.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-intro-en-top-message-${{ github.run_id }}
          path: artifacts/ptscps-intro-en-sample/
          if-no-files-found: warn
          retention-days: 14
