name: PTSCPS PHP deployment (manual opt-in)
on:
  push:
    branches: [main]
    paths: [.ptscps-folders-count-release-request, .ptscps-ml-prefill-release-request, .ptscps-preview-css-release-request, .ptscps-agent-locale-release-request]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_PHP to allow WordPress PHP upload (no Astro build)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  wordpress-php:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_PHP')
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'
              && (github.event.head_commit.message == 'deploy(ptscps): accurate Folders counts PHP only'
                  || github.event.head_commit.message == 'deploy(ptscps): English Page ACF prefill PHP only'
                  || github.event.head_commit.message == 'deploy(ptscps): TablePress preview CSS PHP only'
                  || github.event.head_commit.message == 'deploy(ptscps): bilingual Agent PHP only')))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PTSCPS Actions deploy script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout only PTSCPS WordPress PHP master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: PHP syntax and project identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            case "${{ github.event.head_commit.message }}" in
              'deploy(ptscps): accurate Folders counts PHP only')
                test "$(cat .ptscps-folders-count-release-request)" = 'PTSCPS_FOLDERS_COUNT_ONLY source=f009fff84a000ccde2e7171ea4c7285b92e7227d retry=3'
                test "$(git -C source-php rev-parse HEAD)" = 'f009fff84a000ccde2e7171ea4c7285b92e7227d'
                ;;
              'deploy(ptscps): English Page ACF prefill PHP only')
                test "$(cat .ptscps-ml-prefill-release-request)" = 'PTSCPS_ML_PREFILL_ONLY source=fd6fc1326de58ae9b6f73922c2fa2381bc279b35'
                test "$(git -C source-php rev-parse HEAD)" = 'fd6fc1326de58ae9b6f73922c2fa2381bc279b35'
                ;;
              'deploy(ptscps): TablePress preview CSS PHP only')
                test "$(cat .ptscps-preview-css-release-request)" = 'PTSCPS_PREVIEW_CSS_ONLY source=539bd8ab8a7f266832304923a894fca9730a49d9'
                test "$(git -C source-php rev-parse HEAD)" = '539bd8ab8a7f266832304923a894fca9730a49d9'
                ;;
              'deploy(ptscps): bilingual Agent PHP only')
                test "$(cat .ptscps-agent-locale-release-request)" = 'PTSCPS_AGENT_LOCALE_ONLY source=2a7417e1bec7f71474200137feace3221672c4ed'
                test "$(git -C source-php rev-parse HEAD)" = '2a7417e1bec7f71474200137feace3221672c4ed'
                ;;
              *) exit 1 ;;
            esac
          fi
          php -l source-php/wp-content/mu-plugins/ptscps-folders-accurate-counts.php
          php source-php/wp-content/mu-plugins/tests/ptscps-folders-accurate-counts-test.php
          php -l source-php/wp-content/mu-plugins/esc-multilingual-admin.php
          php source-php/wp-content/mu-plugins/tests/esc-multilingual-prefill-test.php
          php -l source-php/ptscps-unzip.php
          php -l source-php/wp-content/plugins/github-trigger/vcs-build-trigger.php
          php -l source-php/wp-content/mu-plugins/esc-github-trigger-config.php
          php -l source-php/wp-content/mu-plugins/esc-seo-files.php
          php -l source-php/wp-content/themes/vibe-code-theme/functions.php
          php -l source-php/wp-content/themes/vibe-code-theme/inc/tablepress/wysiwyg.php
          ! grep -Eqi 'nghiencuukhoahoc|EduResearch Hub' source-php/wp-content/mu-plugins/esc-seo-files.php
          php -l source-php/wp-content/plugins/github-trigger/tests/build-status-regression.php
          if [[ "${{ github.event_name }}" != "push" ]]; then
            php source-php/wp-content/plugins/github-trigger/tests/build-status-regression.php
          fi
          test "$(cat source-php/ptscps-unzip-v2.ready)" = 'PTSCPS_ASTRO_UNZIP_PROTOCOL=2'
          python3 -m py_compile scripts/ptscps-php-live-release.py
          if [[ "${{ github.event_name }}" == 'push' && "${{ github.event.head_commit.message }}" == 'deploy(ptscps): bilingual Agent PHP only' ]]; then
            for file in               wp-content/mu-plugins/esc-agent.php               wp-content/mu-plugins/esc-agent/src/Core/{Agent,AgentLocale,KnowledgeAwarePlanner,Planner}.php               wp-content/mu-plugins/esc-agent/src/Knowledge/{ArticleKnowledgeRetriever,KnowledgeIndex,KnowledgeRetriever}.php               wp-content/mu-plugins/esc-agent/src/Skills/{CompanySkill,ContactSkill,KnowledgeSearchSkill,PolicySkill}.php; do
              php -l "source-php/$file"
            done
          fi
      - name: Release only PTSCPS WordPress PHP files with protected FTPS
        shell: bash
        env:
          PTSCPS_FOLDERS_ONLY: >-
            ${{ github.event_name == 'push' && github.event.head_commit.message == 'deploy(ptscps): accurate Folders counts PHP only' && '1' || '0' }}
          PTSCPS_ML_ONLY: >-
            ${{ github.event_name == 'push' && github.event.head_commit.message == 'deploy(ptscps): English Page ACF prefill PHP only' && '1' || '0' }}
          PTSCPS_PREVIEW_CSS_ONLY: >-
            ${{ github.event_name == 'push' && github.event.head_commit.message == 'deploy(ptscps): TablePress preview CSS PHP only' && '1' || '0' }}
          PTSCPS_AGENT_LOCALE_ONLY: >-
            ${{ github.event_name == 'push' && github.event.head_commit.message == 'deploy(ptscps): bilingual Agent PHP only' && '1' || '0' }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/ptscps-php-live-release.py
      - name: Probe configured WordPress unzip ready marker (NO BUILD)
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, ssl, time
          from urllib.parse import urlsplit
          from urllib.request import HTTPSHandler, HTTPRedirectHandler, Request, build_opener
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          values=[]
          for line in os.environ['ENV_FILE'].splitlines():
              if line.strip().startswith('WC_URL='):
                  values.append(line.split('=',1)[1].strip().strip('"').strip("'"))
          if len(values)!=1:
              raise RuntimeError('Expected one WordPress WC_URL in ENV_FILE')
          parsed=urlsplit(values[0])
          if not (parsed.scheme=='https' and parsed.hostname
              and not parsed.username and not parsed.password and parsed.port in (None,443)
              and parsed.path in ('','/') and not parsed.query and not parsed.fragment):
              raise RuntimeError('Invalid WordPress HTTPS origin in ENV_FILE')
          client=build_opener(HTTPSHandler(context=ssl.create_default_context()),NoRedirect)
          url=parsed.geturl().rstrip('/')+'/ptscps-unzip-v2.ready'
          for attempt in range(3):
              try:
                  with client.open(Request(url,method='GET'),timeout=20) as response:
                      if response.status==200 and response.read(100).strip()==b'PTSCPS_ASTRO_UNZIP_PROTOCOL=2':
                          print('PTSCPS_WP_UNZIP_READY_MARKER=PASS')
                          break
              except Exception:
                  pass
              if attempt==2:
                  raise RuntimeError('Configured WP unzip readiness endpoint unavailable')
              time.sleep(3)
          PY
