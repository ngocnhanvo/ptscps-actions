name: PTSCPS RUN04 EN collection 503 single-request attribution
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-run04-en-503.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-run04-single-trace
  cancel-in-progress: false
jobs:
  trace:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): trace RUN04 EN service 503 after Planner release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate fixed one-request scope
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-run04-en-503.ready)" = 'PTSCPS_RUN04_EN_503 php=cb612e024a946b3d87b775a31f8ca70a48aae331'
          python3 -m py_compile scripts/ptscps-agent-run04-en-503-trace.py
      - name: Make one English collection request and read only its telemetry
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-run04-en-503-trace.py
      - name: Preserve sanitized result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-agent-run04-en-503-summary
          path: audit/ptscps-agent-run04-en-503-summary.json
          if-no-files-found: warn
          retention-days: 7
