name: PTSCPS two failed first-customer path opt-in trace
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-client-routing-trace.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-first-customer-path-diagnostic
  cancel-in-progress: false
jobs:
  path-trace:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'test(ptscps): trace only two failed first-customer requests'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard exact readonly diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-client-routing-trace.ready)" = 'PTSCPS_CLIENT_TRACE source=b8e5726902835e8274dfcdae803b87e5638a14a1 count=2'
          python3 -m py_compile scripts/ptscps-agent-client-routing-trace.py scripts/ptscps-agent-fact-intent-grounded.py
          python3 scripts/ptscps-agent-fact-intent-grounded.py --self-test
      - name: Two failed first-customer cases with opt-in synthetic trace only
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-client-routing-trace.py
      - name: Save categorical sanitized path evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-first-customer-path-trace-summary
          path: audit/ptscps-agent-client-routing-trace-summary.json
          if-no-files-found: warn
          retention-days: 7
