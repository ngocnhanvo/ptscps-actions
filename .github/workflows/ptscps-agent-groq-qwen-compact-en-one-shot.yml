name: PTSCPS Groq Qwen compact EN paraphrase one-shot
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-groq-qwen-compact-en-one-shot.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-groq-qwen-compact-en-one-shot
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): confirm compact Qwen EN paraphrase once'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: 222aec89067cc534e95f6a7665fc41798ac2024d
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Validate one-shot diagnostic
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-groq-qwen-compact-en-one-shot.ready)" = 'PTSCPS_GROQ_QWEN_COMPACT_EN_ONE_SHOT source=222aec89067cc534e95f6a7665fc41798ac2024d cases=1 model=qwen/qwen3.8-27b'
          python3 -m py_compile scripts/ptscps-agent-groq-qwen-compact-en-one-shot.py scripts/ptscps-agent-groq-qwen-compact-probe.py
          php -l scripts/ptscps-agent-compact-planner-helper.php
      - name: Confirm final compact Qwen EN paraphrase route once
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-groq-qwen-compact-en-one-shot.py
      - name: Upload sanitized one-shot summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-groq-qwen-compact-en-one-shot
          path: audit/ptscps-agent-groq-qwen-compact-en-one-shot-summary.json
          if-no-files-found: warn
          retention-days: 7
