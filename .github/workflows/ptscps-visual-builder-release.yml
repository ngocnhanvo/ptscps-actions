name: PTSCPS Visual Builder guarded release and acceptance
on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-visual-builder-release.ready'
permissions:
  contents: read
  actions: read
concurrency:
  group: ptscps-wordpress-build-ui-trigger
  cancel-in-progress: false
jobs:
  builder-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout current PHP production branch
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Checkout current Astro production branch
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-astro
          persist-credentials: false
      - name: Validate exact source leases and configured project origins
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          from urllib.parse import urlsplit
          request=json.loads(Path('audit/ptscps-visual-builder-release.ready').read_text())
          for key,folder in [('php','source-php'),('astro','source-astro')]:
              expected=request[key]
              assert re.fullmatch('[a-f0-9]{40}',expected)
              actual=subprocess.check_output(['git','-C',folder,'rev-parse','HEAD'],text=True).strip()
              assert actual==expected, 'Source lease changed: '+key
          values={}
          for line in os.environ['ENV_FILE'].splitlines():
              m=re.fullmatch(r'\s*(?:export\s+)?(WC_URL|WC_URL_CLIENT)\s*=\s*(.*?)\s*',line)
              if m:
                  assert m[1] not in values
                  values[m[1]]=m[2].strip().strip('"\'')
          assert values['WC_URL']=='https://admin-ptscps.thegioihosting.io.vn'
          assert values['WC_URL_CLIENT']=='https://ptscps.thegioihosting.io.vn'
          phase=request.get('phase','release')
          assert phase in ('release','build','verify','diagnose')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('WP_ORIGIN='+values['WC_URL']+'\nCLIENT_ORIGIN='+values['WC_URL_CLIENT']+'\n')
              f.write('PTSCPS_PHP_SOURCE_SHA='+request['php']+'\nPTSCPS_ASTRO_SOURCE_SHA='+request['astro']+'\n')
              f.write('BUILDER_RELEASE_PHASE='+phase+'\n')
              f.write('BUILDER_QA_SKIP_SHARED='+('1' if request.get('skip_completed_shared') is True else '0')+'\n')
              f.write('BUILDER_QA_SKIP_TEXT='+('1' if request.get('skip_completed_text') is True else '0')+'\n')
          print('PTSCPS_BUILDER_LEASES=PASS; target=PTSCPS; production_branches=master')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ptscps-vb-playwright-1.64.0-ts-5.8.3-${{ runner.os }}
      - name: Install driver matching preinstalled Chromium
        run: npm install --prefix .qa --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --prefer-offline playwright@1.64.0 typescript@5.8.3
      - name: Offline desktop and mobile interaction contracts
        if: env.BUILDER_RELEASE_PHASE == 'release'
        run: node scripts/ptscps-visual-builder-browser.mjs
      - name: Preflight native Builder and actual configured preview origin
        if: env.BUILDER_RELEASE_PHASE == 'release'
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          BUILDER_STAGE: preflight
        run: node scripts/ptscps-visual-builder-live.mjs
      - name: Stage and activate only Visual Builder PHP with verified FTPS readback
        if: env.BUILDER_RELEASE_PHASE == 'release'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-visual-builder-release.py
      - name: Inspect deployed Astro metadata before any native build
        if: env.BUILDER_RELEASE_PHASE == 'release' || env.BUILDER_RELEASE_PHASE == 'build'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-visual-builder-provenance.py inspect
      - name: Build through native WordPress tool and verify exact completed run
        if: env.BUILDER_RELEASE_PHASE == 'release' || env.BUILDER_RELEASE_PHASE == 'build'
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BUILDER_STAGE: build
        run: node scripts/ptscps-visual-builder-live.mjs
      - name: Verify deployed private Astro provenance through read-only FTPS
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-visual-builder-provenance.py verify
      - name: Verify live Admin REST preview cancel save reload and source restore
        if: env.BUILDER_RELEASE_PHASE != 'diagnose'
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          BUILDER_STAGE: verify
        run: node scripts/ptscps-visual-builder-live.mjs
      - name: Diagnose native verification and private SSR without any CMS writes
        if: env.BUILDER_RELEASE_PHASE == 'diagnose'
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          BUILDER_STAGE: diagnose
        run: node scripts/ptscps-visual-builder-live.mjs
      - name: Read scoped runtime error logs without any deployment
        if: always() && env.BUILDER_RELEASE_PHASE == 'diagnose'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-visual-builder-provenance.py diagnose
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-visual-builder-acceptance
          path: artifacts/visual-builder
          if-no-files-found: ignore
