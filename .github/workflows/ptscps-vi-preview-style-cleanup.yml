name: PTSCPS Vietnamese home saved preview style cleanup (guarded)
on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-vi-preview-style-cleanup.ready'
permissions:
  contents: read
concurrency:
  group: ptscps-home-preview-style-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate PTSCPS origin from configured ENV_FILE
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=dict(re.findall(r'^\s*(WC_URL|WC_URL_CLIENT)\s*=\s*(.+)\s*$',os.getenv('ENV_FILE',''),re.M))
          wp=urlsplit(vals.get('WC_URL','').strip().strip('"\''))
          front=urlsplit(vals.get('WC_URL_CLIENT','').strip().strip('"\''))
          if wp.scheme!='https' or wp.hostname!='admin-ptscps.thegioihosting.io.vn' or front.hostname!='ptscps.thegioihosting.io.vn' or wp.path not in ('','/'):
              raise SystemExit('VI_PREVIEW_CLEANUP=BLOCKED invalid project origin')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('WP_ORIGIN=https://'+wp.hostname+'\n')
          print('VI_PREVIEW_ORIGIN=PASS')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify targeted Vietnamese preview cleanup is idempotent
        run: node scripts/ptscps-vi-preview-style-cleanup.mjs --self-test
      - name: Remove only saved Vietnamese-home preview inline styles and verify
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-vi-preview-style-cleanup.mjs
      - name: Preserve recovery copy of page content for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-vi-home-pre-style-cleanup
          path: artifacts/vi-home-82467-before.html
          if-no-files-found: ignore
          retention-days: 7
