name: PTSCPS Header menu and published link audit (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-header-menu-live.ready'
permissions:
  contents: read
jobs:
  inspect-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate configured origins without printing credentials
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          raw=os.environ.get('ENV_FILE','')
          vals=dict(re.findall(r'^\s*(?:export\s+)?(WC_URL|WC_URL_CLIENT)\s*=\s*(.+)\s*$',raw,re.M))
          def normalize(name):
              v=urlsplit(vals.get(name,'').strip().strip('"\''))
              if v.scheme!='https' or not v.hostname or v.path not in ('','/') or v.query or v.fragment or v.username or v.password or v.port not in (None,443):
                  raise SystemExit('INVALID_ORIGIN '+name)
              return 'https://'+v.hostname
          wp,front=normalize('WC_URL'),normalize('WC_URL_CLIENT')
          if wp==front:raise SystemExit('ORIGINS_NOT_ISOLATED')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('WP_ORIGIN='+wp+'\nFRONT_ORIGIN='+front+'\n')
          print('ORIGIN_VALIDATION=PASS')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect WordPress native menus and target links, read-only
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-header-menu-live-audit.mjs
