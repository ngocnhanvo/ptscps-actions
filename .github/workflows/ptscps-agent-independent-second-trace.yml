name: PTSCPS targeted two failed second-row LLM path traces
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-independent-second-trace.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-independent-second-trace
  cancel-in-progress: false
jobs:
  scoped-trace:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): identify homepage collection candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact scope and syntax
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-independent-second-trace.ready)" = 'PTSCPS_SECOND_TRACE source=dec0bf3a76ab1036d0ae85aeb4033acfefa41b80 cases=2 candidates=public'
          python3 -m py_compile scripts/ptscps-agent-client-routing-trace.py scripts/ptscps-agent-independent-fact-sample.py scripts/ptscps-agent-independent-second-trace.py
      - name: Trace ONLY two already failed second-row questions
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-independent-second-trace.py
      - name: Retain sanitized categorical trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-two-second-row-failed-case-trace
          path: audit/ptscps-agent-independent-second-trace-summary.json
          if-no-files-found: warn
          retention-days: 7
