name: PTSCPS WordPress-native REST Header menu setup (guarded)
on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-native-header-rest-setup.ready'
permissions:
  contents: read
jobs:
  native-header:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate two isolated WordPress and frontend origins
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=dict(re.findall(r'^\s*(?:export\s+)?(WC_URL|WC_URL_CLIENT)\s*=\s*(.+)\s*$',os.environ.get('ENV_FILE',''),re.M))
          def normalize(k):
              p=urlsplit(vals.get(k,'').strip().strip('"\''))
              if p.scheme!='https' or not p.hostname or p.path not in ('','/') or p.query or p.fragment or p.username or p.password or p.port not in (None,443):raise SystemExit('INVALID_ORIGIN '+k)
              return 'https://'+p.hostname
          wp,front=normalize('WC_URL'),normalize('WC_URL_CLIENT')
          if wp==front:raise SystemExit('ORIGIN_COLLISION')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'WP_ORIGIN={wp}\nFRONT_ORIGIN={front}\n')
          print('ORIGIN_VALIDATION=PASS')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Create only verified native WordPress menu and real homepage item
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-menu-native-rest-setup.mjs
