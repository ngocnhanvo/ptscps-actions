name: PTSCPS canonical TablePress metadata guarded PHP release and targeted QA
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-ordinal-row-release.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  guarded-php:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): canonical TablePress metadata PHP and two-case QA'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: b229f7fd9e18b91879a6599315ae087786543a24
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Validate exact PHP source and ordinal regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-ordinal-row-release.ready)" = 'PTSCPS_CANONICAL_TABLEPRESS source=b229f7fd9e18b91879a6599315ae087786543a24 files=1 qa=2'
          test "$(git -C source-php rev-parse HEAD)" = 'b229f7fd9e18b91879a6599315ae087786543a24'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeIndex.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-original-query-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-collection-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-source-registry-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py scripts/ptscps-agent-second-row-only-retest.py
      - name: Deploy only KnowledgeIndex via protected FTPS with readback
        env:
          PTSCPS_AGENT_COLLECTION_METADATA_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
  targeted-postrelease:
    needs: [guarded-php]
    if: needs.guarded-php.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck only the two prior HTTP-200 wrong-answer cases
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: python3 scripts/ptscps-agent-second-row-only-retest.py
      - name: Store sanitized targeted QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-canonical-tablepress-targeted-qa
          path: audit/ptscps-agent-second-row-only-summary.json
          if-no-files-found: warn
          retention-days: 7
