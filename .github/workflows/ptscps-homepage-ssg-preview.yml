name: PTSCPS homepage SSG browser preview (read-only)

on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-homepage-preview.ready'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - name: Resolve validated frontend origin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals={}
          for line in os.environ.get('ENV_FILE','').splitlines():
              m=re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$',line)
              if m: vals[m.group(1)]=m.group(2).strip().strip('"\'')
          front=urlsplit(vals.get('WC_URL_CLIENT',''))
          if (front.scheme!='https' or not front.hostname or front.username or front.password
              or front.port not in (None,443) or front.path not in ('','/')
              or front.query or front.fragment):
              raise SystemExit('Invalid WC_URL_CLIENT origin')
          origin='https://'+front.hostname
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as out:
              out.write('PTSCPS_CLIENT_ORIGIN='+origin+'\n')
          print('PTSCPS_PREVIEW_ORIGIN=PASS')
          PY

      - name: Install Playwright wrapper
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0 >/dev/null

      - name: Render deployed SSG bundle as root and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const origin = process.env.PTSCPS_CLIENT_ORIGIN;
          if (!origin) throw new Error('PTSCPS_CLIENT_ORIGIN is missing');
          const staticEntry = origin + '/client/index.html';
          const browser = await chromium.launch({ headless: true });
          const notes = [];

          async function capture(name, viewport, isMobile = false) {
            const context = await browser.newContext({
              viewport,
              isMobile,
              deviceScaleFactor: 1,
              locale: 'vi-VN',
            });
            const page = await context.newPage();
            const failed = [];
            page.on('requestfailed', request => {
              try {
                const u = new URL(request.url());
                if (u.origin === origin) failed.push(u.pathname);
              } catch {}
            });

            // Render the live public SSG root when it is available. Only the
            // legacy /client-only hosting layout needs temporary route mapping.
            let liveRoot = false;
            try {
              const probe = await page.request.get(origin + '/', { timeout: 18000, failOnStatusCode: false });
              liveRoot = probe.status() === 200 && (probe.headers()['content-type'] || '').toLowerCase().includes('html');
            } catch (error) {
              console.log('PTSCPS_PREVIEW_ROOT_PROBE_WARNING=' + (error?.name || 'network'));
            }
            console.log('PTSCPS_PREVIEW_RENDER_MODE=' + (liveRoot ? 'public-root' : 'client-fallback'));
            if (!liveRoot) await page.route(origin + '/**', async route => {
              const request = route.request();
              const url = new URL(request.url());
              let mapped = null;
              if (url.origin === origin && url.pathname === '/') {
                mapped = staticEntry;
              } else if (
                url.origin === origin &&
                !url.pathname.startsWith('/client/') &&
                (url.pathname.startsWith('/_astro/') ||
                 url.pathname.startsWith('/images/') ||
                 url.pathname.startsWith('/data/') ||
                 url.pathname.startsWith('/fonts/'))
              ) {
                mapped = origin + '/client' + url.pathname + url.search;
              }
              if (!mapped) return route.continue();
              const response = await route.fetch({ url: mapped });
              await route.fulfill({ response });
            });

            const response = await page.goto(origin + '/', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            if (!response || response.status() !== 200) {
              throw new Error(`Preview root did not render HTTP 200 (${response?.status()})`);
            }
            await page.locator('body').waitFor({ state: 'visible', timeout: 15000 });
            await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });
            await page.waitForTimeout(2500);
            // PTSCPS header regression: accessible search and language controls,
            // scroll background and fixed alignment across device breakpoints.
            const toolsScope = viewport.width >= 900 ? 'desktop' : 'mobile';
            const headerTools = page.locator(`[data-header-tools-scope="${toolsScope}"]`);
            if (await headerTools.count() !== 1) throw new Error(`${name}: Header tools missing`);
            const toggle = headerTools.locator('[data-header-search-toggle]');
            await toggle.click();
            if (await toggle.getAttribute('aria-expanded') !== 'true' ||
                !(await headerTools.locator('[data-header-search-panel] input[name="q"]').isVisible()))
              throw new Error(`${name}: header Search did not open`);
            await page.keyboard.press('Escape');
            if (await toggle.getAttribute('aria-expanded') !== 'false')
              throw new Error(`${name}: Escape did not close header Search`);
            const language = headerTools.locator('[data-header-language]');
            await language.locator('summary').click();
            if (!(await language.evaluate(element => element.open)))
              throw new Error(`${name}: language switcher did not open`);
            await page.keyboard.press('Escape');
            if (await language.evaluate(element => element.open))
              throw new Error(`${name}: Escape did not close language switcher`);
            await page.evaluate(() => window.scrollTo({top: 250, behavior: 'instant'}));
            await page.waitForTimeout(350);
            const headerAppearance = await page.locator('#main-header').evaluate(header => {
              const bar = header.querySelector('#header-brandbar');
              const barStyle = getComputedStyle(bar);
              return {
                scrolled: header.classList.contains('header-scrolled'),
                background: barStyle.backgroundColor,
                filter: barStyle.backdropFilter || barStyle.webkitBackdropFilter,
                parentBackground: getComputedStyle(header).backgroundColor,
              };
            });
            const glassDebug = await page.locator('#header-brandbar').evaluate(bar => {
              const matches = [];
              const inspect = rules => {
                for (const rule of rules) {
                  if (rule.selectorText?.includes('#header-brandbar'))
                    matches.push({selector: rule.selectorText.slice(0, 180), css: rule.style?.cssText.slice(0, 450)});
                  if (rule.cssRules) inspect(rule.cssRules);
                }
              };
              for (const sheet of document.styleSheets) {
                try { inspect(sheet.cssRules); } catch {}
              }
              const style = getComputedStyle(bar);
              return {
                supportsBlur: CSS.supports('backdrop-filter', 'blur(18px) saturate(145%)'),
                prefixed: style.webkitBackdropFilter,
                unprefixed: style.backdropFilter,
                inline: bar.getAttribute('style'),
                matchingRules: matches.slice(-16),
              };
            });
            console.log('PTSCPS_GLASS_DIAGNOSTIC=' + JSON.stringify({name, ...glassDebug}));
            const glassAlpha = Number(headerAppearance.background.match(/rgba\([^,]+,[^,]+,[^,]+,\s*([\d.]+)\)/)?.[1] ?? 1);
            if (!headerAppearance.scrolled || !(glassAlpha > 0 && glassAlpha < 1) ||
                !headerAppearance.filter.includes('blur(') ||
                headerAppearance.parentBackground !== 'rgba(0, 0, 0, 0)')
              throw new Error(`${name}: dynamic frosted header missing: ${JSON.stringify(headerAppearance)}`);
            console.log('PTSCPS_HEADER_TOOLS_QA=' + JSON.stringify({name, scope:toolsScope, ...headerAppearance, glassAlpha, status:'PASS'}));
            if (name === 'desktop') {
              // Read-only logo provenance audit: detect opaque pixels in CMS and deployed logo.
              const logoInfo = await page.locator('#header-brandbar a[aria-label="Về trang chủ"] img').evaluate(img => ({
                src: img.getAttribute('src'), currentSrc: img.currentSrc, srcset: img.getAttribute('srcset'),
                naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight,
                background: getComputedStyle(img).backgroundColor,
                parentBackground: getComputedStyle(img.parentElement).backgroundColor,
              }));
              const inspectLogoUrl = async (url) => {
                const res = await page.request.get(new URL(url, origin).href, {timeout:25000, failOnStatusCode:false});
                if (res.status() !== 200) return {status:res.status(),url};
                const mime = (res.headers()['content-type'] || 'image/png').split(';')[0];
                const binary = await res.body();
                const stats = await page.evaluate(async ({mime, base64}) => {
                  const img = new Image();
                  img.src = `data:${mime};base64,${base64}`;
                  await img.decode();
                  const cv = document.createElement('canvas');
                  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
                  const ctx = cv.getContext('2d', {willReadFrequently: true});
                  ctx.drawImage(img, 0, 0);
                  const px = ctx.getImageData(0, 0, cv.width, cv.height).data;
                  let transparent=0,partial=0,opaque=0,whiteOpaque=0;
                  for(let i=0;i<px.length;i+=4) {
                    const a=px[i+3];
                    if(a===0)transparent++;
                    else if(a<255)partial++;
                    else {opaque++; if(px[i]>242 && px[i+1]>242 && px[i+2]>242)whiteOpaque++;}
                  }
                  return {width:cv.width,height:cv.height,transparent,partial,opaque,whiteOpaque,
                          topLeft:[...px.slice(0,4)],topRight:[...px.slice((cv.width-1)*4,cv.width*4)]};
                }, {mime,base64:binary.toString('base64')});
                return {status:res.status(),mime,url,bytes:binary.length,...stats};
              };
              console.log('PTSCPS_LOGO_RENDER=' + JSON.stringify(logoInfo));
              console.log('PTSCPS_LOGO_DEPLOYED_ALPHA=' + JSON.stringify(await inspectLogoUrl(logoInfo.currentSrc)));
              const wpMatch = (process.env.ENV_FILE || '').match(/^\s*WC_URL\s*=\s*(.+)\s*$/m);
              if (wpMatch) {
                const wpOrigin = wpMatch[1].trim().replace(/^['"]|['"]$/g,'').replace(/\/$/,'');
                const infoRes = await page.request.get(`${wpOrigin}/wp-json/wp/v2/thong-tin-chung/62`, {timeout:20000,failOnStatusCode:false});
                if (infoRes.status() === 200) {
                  const wpInfo = await infoRes.json();
                  const wpLogo = wpInfo?.acf?.logo?.url;
                  console.log('PTSCPS_LOGO_WP_URL=' + JSON.stringify({status:200,url:wpLogo || null,modified:wpInfo.modified}));
                  if (wpLogo) console.log('PTSCPS_LOGO_WP_ALPHA=' + JSON.stringify(await inspectLogoUrl(wpLogo)));
                } else console.log('PTSCPS_LOGO_WP_URL=' + JSON.stringify({status:infoRes.status()}));
              }
              const searchResponse = await page.request.get(origin + '/tim-kiem?q=PTSC', {timeout:20000});
              if (searchResponse.status() !== 200 || !(await searchResponse.text()).includes('site-search-index'))
                throw new Error('Static search results route missing');
              console.log('PTSCPS_STATIC_SEARCH_ROUTE=PASS');
            }
            await page.evaluate(() => window.scrollTo({top: 0, behavior: 'instant'}));
            // Homepage regression: verify all three CMS slides and the responsive
            // image/icon overlap at mobile, tablet and desktop widths.
            const device = viewport.width < 640 ? 'mobile' : 'desktop';
            const slider = page.locator(`[data-pps-hero-slider][data-slider-device="${device}"]`);
            const slides = slider.locator('[data-pps-slide]');
            const slideCount = await slides.count();
            if (slideCount !== 3) throw new Error(`${name}: expected 3 CMS banners, got ${slideCount}`);
            if (!(await slides.first().evaluate(image => image.complete && image.naturalWidth > 0)))
              throw new Error(`${name}: initial banner image not loaded`);
            const controls = page.locator(`[data-pps-hero-controls][data-slider-device="${device}"]`);
            await controls.locator('[data-pps-slide-next]').click();
            await page.waitForTimeout(200);
            const nextActive = await controls.locator('[data-pps-slide-dot="1"]').getAttribute('aria-current');
            if (nextActive !== 'true') throw new Error(`${name}: next banner did not activate`);
            await controls.locator('[data-pps-slide-prev]').click();
            const overlap = await page.locator('[data-pps-section="services"] article').first().evaluate(card => {
              const image = card.querySelector('img');
              const badge = card.querySelector('div[aria-hidden="true"]');
              if (!image || !badge) return null;
              const i = image.getBoundingClientRect();
              const b = badge.getBoundingClientRect();
              return { imageBottom: Math.round(i.bottom), iconTop: Math.round(b.top), iconBottom: Math.round(b.bottom), cardWidth: Math.round(card.getBoundingClientRect().width) };
            });
            if (!overlap || !(overlap.iconTop < overlap.imageBottom && overlap.iconBottom > overlap.imageBottom))
              throw new Error(`${name}: service badge does not overlap the image boundary: ${JSON.stringify(overlap)}`);
            console.log('PTSCPS_RESPONSIVE_QA=' + JSON.stringify({name, device, slideCount, nextActive, overlap, status:'PASS'}));
            const initialHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            const scrollStep = Math.max(320, Math.floor(viewport.height * 0.72));
            for (let y = 0; y < initialHeight; y += scrollStep) {
              await page.evaluate((top) => window.scrollTo({ top, behavior: 'instant' }), y);
              await page.waitForTimeout(140);
            }
            await page.evaluate(() => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' }));
            await page.waitForTimeout(350);
            await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
            await page.waitForTimeout(250);
            const bodyText = (await page.locator('body').innerText()).trim();
            if (bodyText.length < 30) throw new Error('Preview has no meaningful visible content');
            const dimensions = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              scrollHeight: document.documentElement.scrollHeight,
            }));
            const inspection = await page.evaluate(() => {
              const sections = Array.from(document.querySelectorAll('main section')).map((el) => {
                const style = getComputedStyle(el);
                const box = el.getBoundingClientRect();
                return {
                  type: el.getAttribute('data-pps-section') || 'other',
                  reveal: el.classList.contains('is-scroll-reveal-visible'),
                  opacity: style.opacity,
                  display: style.display,
                  y: Math.round(box.top + window.scrollY),
                  height: Math.round(box.height),
                };
              });
              const offenders = Array.from(document.body.querySelectorAll('*'))
                .map(el => ({ el, box: el.getBoundingClientRect() }))
                .filter(({ box }) => box.width > 0 && box.right > innerWidth + 2)
                .sort((a, b) => b.box.right - a.box.right)
                .slice(0, 12).map(({ el, box }) => ({
                  tag: el.tagName,
                  id: el.id || '',
                  classes: String(el.className?.baseVal ?? el.className ?? '').slice(0, 70),
                  right: Math.round(box.right),
                  width: Math.round(box.width),
                }));
              const logo = document.querySelector('#header-brandbar a[aria-label="Về trang chủ"] img');
              return { sections, offenders, logo: { present: !!logo, loaded: !!logo?.naturalWidth } };
            });
            console.log('PTSCPS_PREVIEW_INSPECTION=' + JSON.stringify({ name, ...inspection }));
            await page.screenshot({ path: `preview/home-${name}.png`, fullPage: true });
            notes.push(`${name}: render_mode=${liveRoot ? 'public-root' : 'client-fallback'}; title=${JSON.stringify(await page.title())}; body_chars=${bodyText.length}; client_width=${dimensions.clientWidth}; scroll_width=${dimensions.scrollWidth}; scroll_height=${dimensions.scrollHeight}; overflow_x=${dimensions.scrollWidth > dimensions.clientWidth ? 'yes' : 'no'}; failed_same_origin=${failed.slice(0,20).join(',') || 'none'}`);
            await context.close();
          }

          try {
            await capture('desktop', { width: 1440, height: 1000 }, false);
            await capture('tablet', { width: 768, height: 1024 }, false);
            await capture('mobile', { width: 390, height: 844 }, true);
            await writeFile('preview/preview-meta.txt', [
              'PTSCPS homepage SSG preview',
              'Simulation: public / is fulfilled from deployed /client/index.html.',
              'Root static assets are mapped to /client equivalents inside Playwright only.',
              ...notes,
            ].join('\n') + '\n');
          } finally {
            await browser.close();
          }
          JS

      - name: Publish screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-homepage-ssg-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7
