name: PTSCPS ordinal semantic guard guarded release and regression QA
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-ordinal-semantic-guard-release.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  guarded-php:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): ordinal semantic guard and regression QA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: 4ab2eddbebeeef730dcc1d9c69bab03b427392a3
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify ordinal guard and regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-ordinal-semantic-guard-release.ready)" = 'PTSCPS_ORDINAL_SEMANTIC_GUARD source=4ab2eddbebeeef730dcc1d9c69bab03b427392a3 files=1'
          test "$(git -C source-php rev-parse HEAD)" = '4ab2eddbebeeef730dcc1d9c69bab03b427392a3'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Skills/KnowledgeSearchSkill.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-semantic-variant-retrieval-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-original-query-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-canonical-ordinal-evidence-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-source-registry-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py scripts/ptscps-agent-semantic-paraphrase-qa.py scripts/ptscps-agent-independent-fact-sample.py
      - name: Deploy guarded KnowledgeSearchSkill through protected FTPS readback
        env:
          PTSCPS_AGENT_ORDINAL_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
  postrelease-regression:
    needs: [guarded-php]
    if: needs.guarded-php.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck eight source-grounded positional facts and semantic paraphrase pair
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set +e
          python3 scripts/ptscps-agent-independent-fact-sample.py
          ordinal_status=$?
          python3 scripts/ptscps-agent-semantic-paraphrase-qa.py
          semantic_status=$?
          echo "PTSCPS_ORDINAL_POSTRELEASE_STATUS=$ordinal_status"
          echo "PTSCPS_SEMANTIC_POSTRELEASE_STATUS=$semantic_status"
          if [[ $ordinal_status -ne 0 || $semantic_status -ne 0 ]]; then exit 1; fi
      - name: Upload sanitized regression summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-ordinal-semantic-regression-qa
          path: |
            audit/ptscps-agent-independent-fact-summary.json
            audit/ptscps-agent-semantic-paraphrase-summary.json
          if-no-files-found: warn
          retention-days: 7
