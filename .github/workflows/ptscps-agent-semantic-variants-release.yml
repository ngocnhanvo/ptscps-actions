name: PTSCPS semantic variant retrieval guarded release and paraphrase QA
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-semantic-variants-release.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  guarded-php:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): semantic variant retrieval and paraphrase QA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: a5d65e8df6748b055b10967d96e88d33afe19d66
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify semantic source and regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-semantic-variants-release.ready)" = 'PTSCPS_SEMANTIC_VARIANTS source=a5d65e8df6748b055b10967d96e88d33afe19d66 files=2 pairs=2'
          test "$(git -C source-php rev-parse HEAD)" = 'a5d65e8df6748b055b10967d96e88d33afe19d66'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Core/Planner.php
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Skills/KnowledgeSearchSkill.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-semantic-variant-retrieval-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-original-query-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-canonical-ordinal-evidence-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-source-registry-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py scripts/ptscps-agent-semantic-paraphrase-qa.py
          python3 scripts/ptscps-agent-semantic-paraphrase-qa.py --self-test
      - name: Deploy KnowledgeSearchSkill first through protected FTPS readback
        env:
          PTSCPS_AGENT_ORDINAL_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
      - name: Deploy Planner prompt second through protected FTPS readback
        env:
          PTSCPS_AGENT_PLANNER_PROMPT_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
  paraphrase-postrelease:
    needs: [guarded-php]
    if: needs.guarded-php.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test VI and EN semantic paraphrase consistency on production
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: python3 scripts/ptscps-agent-semantic-paraphrase-qa.py
      - name: Publish sanitized paraphrase QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-semantic-paraphrase-qa
          path: audit/ptscps-agent-semantic-paraphrase-summary.json
          if-no-files-found: warn
          retention-days: 7
