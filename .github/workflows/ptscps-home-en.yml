name: PTSCPS English homepage CMS (guarded)
on:
  push:
    branches: [main]
    paths:
      - 'audit/ptscps-home-en-audit.ready'
      - 'audit/ptscps-home-en-write.ready'
permissions:
  contents: read
concurrency:
  group: ptscps-home-english-cms
  cancel-in-progress: false
jobs:
  english-home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate WordPress origin from configured ENV_FILE
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          vals=dict(re.findall(r'^\s*(WC_URL|WC_URL_CLIENT)\s*=\s*(.+)\s*$',os.environ.get('ENV_FILE',''),re.M))
          wp=urlsplit(vals.get('WC_URL','').strip().strip('"\''))
          front=urlsplit(vals.get('WC_URL_CLIENT','').strip().strip('"\''))
          if wp.scheme!='https' or not wp.hostname or wp.hostname==front.hostname or wp.path not in ('','/') or wp.query or wp.fragment or wp.username or wp.password or wp.port not in (None,443):
              raise SystemExit('EN_HOME_CMS=BLOCKED: invalid WordPress origin')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('WP_ORIGIN=https://'+wp.hostname+'\n')
          print('EN_HOME_CMS_ORIGIN=PASS')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Determine guarded action from checked-out commit
        id: change
        shell: bash
        run: |
          set -euo pipefail
          git show --pretty=format: --name-only HEAD | sed '/^$/d' > /tmp/ptscps-en-changed.txt
          if grep -Fxq 'audit/ptscps-home-en-write.ready' /tmp/ptscps-en-changed.txt; then
            echo 'write=true' >> "$GITHUB_OUTPUT"
          else
            echo 'write=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Fxq 'audit/ptscps-home-en-audit.ready' /tmp/ptscps-en-changed.txt; then
            echo 'audit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'audit=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Audit English homepage and reusable media (read-only)
        if: steps.change.outputs.audit == 'true'
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-home-en.mjs
      - name: Populate English tables and publish localized homepage (guarded)
        if: steps.change.outputs.write == 'true'
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-home-en-write.mjs
