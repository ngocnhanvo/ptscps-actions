name: PTSCPS RAG RUN03 guarded PHP stage attribution
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-rag-run03-stages.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  release-and-diagnose:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): RUN03 guarded stage attribution PHP only'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: 0b96275c0da1b249ef3956a4b19188162eb0e2f7
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify pinned PHP source, regression and diagnostic syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-rag-run03-stages.ready)" = 'PTSCPS_RUN03_STAGES_READ_ONLY source=0b96275c0da1b249ef3956a4b19188162eb0e2f7'
          test "$(git -C source-php rev-parse HEAD)" = '0b96275c0da1b249ef3956a4b19188162eb0e2f7'
          for file in wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeIndex.php \
            wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeInventory.php; do
            php -l "source-php/$file"
          done
          php source-php/wp-content/mu-plugins/tests/esc-agent-retrieval-readonly-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-source-locale-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py
          node --check scripts/ptscps-agent-rag-run03-stages.mjs
      - name: Guarded PHP-only FTPS release with SHA-256 readback and rollback
        env:
          PTSCPS_AGENT_KNOWLEDGE_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright driver (Chromium preinstalled)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Attribute RUN03 retrieval misses by read-only stage
        env:
          PTSCPS_SOURCE_SHA: 0b96275c0da1b249ef3956a4b19188162eb0e2f7
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-agent-rag-run03-stages.mjs
      - name: Upload aggregate-only stage attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-rag-run03-stages-summary
          path: audit/ptscps-agent-rag-run03-stages-summary.json
          if-no-files-found: warn
          retention-days: 14
