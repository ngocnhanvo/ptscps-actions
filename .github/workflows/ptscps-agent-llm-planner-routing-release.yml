name: PTSCPS Agent LLM planner routing protected PHP-only release
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-llm-planner-routing-release.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): LLM planner routing PHP only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protected release scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact approved PHP SHA
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: b9880e6f268b9d122609b30a7c6744b9d7f31d82
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Validate pinned source, strict scope and existing fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-llm-planner-routing-release.ready)" = 'PTSCPS_AGENT_LLM_PLANNER_ROUTING source=b9880e6f268b9d122609b30a7c6744b9d7f31d82 mode=php-only'
          test "$(git -C source-php rev-parse HEAD)" = 'b9880e6f268b9d122609b30a7c6744b9d7f31d82'
          grep -Fq 'PTSCPS_AGENT_PROVIDER_ROUTING_ONLY' scripts/ptscps-php-live-release.py
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Core/LlmProviderConfig.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-planner-priority-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-llm-fail-closed-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py
      - name: Atomic protected FTPS one PHP config file only
        shell: bash
        env:
          PTSCPS_AGENT_PROVIDER_ROUTING_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
      - name: Confirm production Planner uses LLM and errors remain explicit VI/EN
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/ptscps-agent-llm-runtime-trace.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('audit/ptscps-agent-llm-runtime-trace-result.json').read_text())
          cases=report.get('cases',[])
          assert len(cases)==4, 'Missing VI/EN cases'
          assert all(row.get('frontend',{}).get('answered') and row['frontend'].get('http')==200 for row in cases), 'LLM answers unavailable; report failure, no PHP fallback'
          for row in cases:
              events=report.get('traces',{}).get(row['id']+'-frontend')
              assert isinstance(events,list) and events, 'Missing protected LLM request evidence'
              planners=[e for e in events if e.get('event')=='llm_request' and e.get('stage')=='planner']
              assert planners, 'No LLM Planner call observed'
              assert all(e.get('provider')!='cloudflare' for e in planners), 'Unreliable Cloudflare planner route remains'
              assert any(e.get('event')=='request_end' and e.get('result')=='success' for e in events), 'No successful LLM completion'
          print('PTSCPS_LLM_PLANNER_ROUTING_LIVE_QA=PASS answered=4/4 planner=LLM cloudflare_planner=0')
          PY
      - name: Preserve sanitized production QA metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-agent-llm-planner-routing-live-qa
          path: audit/ptscps-agent-llm-runtime-trace-result.json
          if-no-files-found: warn
          retention-days: 7
