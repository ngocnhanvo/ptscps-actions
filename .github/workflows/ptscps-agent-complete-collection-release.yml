name: PTSCPS Agent complete collection PHP-only production acceptance
on:
  push:
    branches: [main]
    paths:
      - audit/ptscps-agent-complete-collection-release.ready
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): guarded complete collection response PHP'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PTSCPS Actions exact release tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact pinned PHP source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify pin and complete collection regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-complete-collection-release.ready)" = 'PTSCPS_AGENT_COMPLETE_COLLECTION_RELEASE source=46219e6dc56615b45a473cff883e4f20b6f2df5d mode=php-only'
          test "$(git -C source-php rev-parse HEAD)" = '46219e6dc56615b45a473cff883e4f20b6f2df5d'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Core/KnowledgeAwarePlanner.php
          php -l source-php/wp-content/mu-plugins/tests/esc-agent-complete-collection-summary-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-complete-collection-summary-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-collection-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-routing-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-source-registry-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py scripts/ptscps-agent-factual-acceptance.py
          grep -Fq 'PTSCPS_AGENT_PUBLISHED_ROUTING_ONLY' scripts/ptscps-php-live-release.py
      - name: Atomic one-file PHP FTPS release SHA-256 verified
        shell: bash
        env:
          PTSCPS_AGENT_PUBLISHED_ROUTING_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/ptscps-php-live-release.py
      - name: Ground-truth factual acceptance for 4 published VI EN collections
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: python3 scripts/ptscps-agent-factual-acceptance.py
      - name: Preserve sanitized factual evidence even if assertions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-agent-complete-collection-live-qa
          path: audit/ptscps-agent-factual-acceptance-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Confirm no Astro build or index mutation
        run: echo PTSCPS_AGENT_COMPLETE_COLLECTION_PHP_ONLY=PASS
