name: PTSCPS Agent knowledge phase 1 inventory-only release
on:
  push:
    branches: [main]
    paths:
      - audit/ptscps-agent-knowledge-phase1-release.ready
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  agent-phase1:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): Agent knowledge phase 1 inventory only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout controlled release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned PTSCPS WordPress PHP
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Pin source and preflight all Agent dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-knowledge-phase1-release.ready)" = 'PTSCPS_AGENT_KNOWLEDGE_PHASE1 source=a4b517de654ed5a781874e032934527b4ef62087 mode=read-only-inventory'
          test "$(git -C source-php rev-parse HEAD)" = 'a4b517de654ed5a781874e032934527b4ef62087'
          for f in \
            wp-content/mu-plugins/esc-agent.php \
            wp-content/mu-plugins/esc-agent/src/Core/AgentLocale.php \
            wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeChunker.php \
            wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeIndex.php \
            wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeInventory.php \
            wp-content/mu-plugins/esc-agent/src/Knowledge/ProductKnowledgeSource.php; do
            php -l "source-php/$f"
          done
          for test in \
            esc-agent-source-locale-test.php \
            esc-agent-knowledge-inventory-test.php \
            esc-agent-chunker-lossless-test.php \
            esc-agent-product-facts-test.php; do
            php "source-php/wp-content/mu-plugins/tests/$test"
          done
          python3 -m py_compile scripts/ptscps-php-live-release.py
          node --check scripts/ptscps-agent-knowledge-inventory.mjs
      - name: Protected six-file PHP release with remote readback and rollback
        shell: bash
        env:
          PTSCPS_AGENT_KNOWLEDGE_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/ptscps-php-live-release.py
      - name: Install headless Chromium for read-only audit
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Export authenticated read-only inventory (no reindex)
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-agent-knowledge-inventory.mjs
      - name: Preserve seven-day audit artifact without CMS bodies
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-knowledge-inventory-phase1
          path: audit/ptscps-agent-knowledge-inventory.json
          retention-days: 7
          if-no-files-found: error
