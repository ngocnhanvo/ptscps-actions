name: PTSCPS bounded direct Gemini fallback compatibility probe
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-gemini-direct-compat-probe.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-gemini-direct-compat-probe
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): probe Gemini planner fallback compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate bounded provider-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-gemini-direct-compat-probe.ready)" = 'PTSCPS_GEMINI_DIRECT_COMPAT source=a73b33da2f8fbf12d2e59c4d1f5aa8ada42733e1 models=2 ops=4'
          python3 -m py_compile scripts/ptscps-agent-gemini-direct-compat-probe.py
      - name: Probe configured Gemini fallbacks without Agent traffic
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-gemini-direct-compat-probe.py
      - name: Upload sanitized compatibility summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-gemini-direct-compat-probe
          path: audit/ptscps-agent-gemini-direct-compat-probe-summary.json
          if-no-files-found: warn
          retention-days: 7
