name: PTSCPS DB-only canonical ordinal evidence guarded release and targeted QA
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-ordinal-db-canonical-release.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  guarded-php:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): DB-only canonical ordinal evidence and targeted QA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: a73b33da2f8fbf12d2e59c4d1f5aa8ada42733e1
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify DB-only ordinal evidence and regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-ordinal-db-canonical-release.ready)" = 'PTSCPS_ORDINAL_DB_CANONICAL source=a73b33da2f8fbf12d2e59c4d1f5aa8ada42733e1 files=1 cases=2'
          test "$(git -C source-php rev-parse HEAD)" = 'a73b33da2f8fbf12d2e59c4d1f5aa8ada42733e1'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeRetriever.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-canonical-ordinal-evidence-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-original-query-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-semantic-variant-retrieval-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-source-registry-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py scripts/ptscps-agent-second-row-only-retest.py
      - name: Deploy canonical retriever through protected FTPS readback
        env:
          PTSCPS_AGENT_ORDINAL_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
  targeted-postrelease:
    needs: [guarded-php]
    if: needs.guarded-php.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck only two previously failed VI/EN second-service facts
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: python3 scripts/ptscps-agent-second-row-only-retest.py
      - name: Upload sanitized targeted QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-ordinal-db-canonical-two-case-qa
          path: audit/ptscps-agent-second-row-only-summary.json
          if-no-files-found: warn
          retention-days: 7
