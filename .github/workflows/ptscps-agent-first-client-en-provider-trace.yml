name: PTSCPS first-client EN-only postrelease LLM path trace
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-first-client-en-provider-trace.ready]
permissions:
  contents: read
jobs:
  one-en-only:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): one failed EN customer provider trace only'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact one-request scope and Python syntax
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-first-client-en-provider-trace.ready)" = 'PTSCPS_ONE_EN_503_TRACE source=4f8e755c6a9f11c3b1fd22b2bfc5fc8fa7a0c1ab count=1'
          python3 -m py_compile scripts/ptscps-agent-first-client-en-after-release.py scripts/ptscps-agent-client-routing-trace.py
      - name: EN-only opt-in request and categorical event trace
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-first-client-en-after-release.py
      - name: Save sanitized EN-only run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-first-client-en-only-provider-trace
          path: audit/ptscps-first-client-en-provider-trace-summary.json
          if-no-files-found: warn
          retention-days: 7
