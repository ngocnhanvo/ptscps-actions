name: PTSCPS canonical published TablePress ordinal evidence guarded release and two-case QA
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-canonical-ordinal-release.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  guarded-php:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): canonical public ordinal evidence and two-case QA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: 1d272434f3377653792a317fe6ab96698b65de0d
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify source, syntax, and existing + new ordinal regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-canonical-ordinal-release.ready)" = 'PTSCPS_CANONICAL_ORDINAL source=1d272434f3377653792a317fe6ab96698b65de0d files=1 cases=2'
          test "$(git -C source-php rev-parse HEAD)" = '1d272434f3377653792a317fe6ab96698b65de0d'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeRetriever.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-original-query-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-ordinal-collection-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-canonical-ordinal-evidence-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-source-registry-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py scripts/ptscps-agent-second-row-only-retest.py
      - name: Deploy only canonical ordinal retriever through protected FTPS readback
        env:
          PTSCPS_AGENT_ORDINAL_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
  targeted-postrelease:
    needs: [guarded-php]
    if: needs.guarded-php.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test only two previously failed VI/EN ordinal service questions
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: python3 scripts/ptscps-agent-second-row-only-retest.py
      - name: Publish sanitized two-case QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-canonical-ordinal-two-case-qa
          path: audit/ptscps-agent-second-row-only-summary.json
          if-no-files-found: warn
          retention-days: 7
