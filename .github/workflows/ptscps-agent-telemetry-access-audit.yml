name: PTSCPS Agent telemetry FTPS access audit (read-only)
on:
  push:
    branches: [main]
    paths:
      - audit/ptscps-agent-telemetry-access.ready
permissions:
  contents: read
concurrency:
  group: ptscps-agent-telemetry-access
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): diagnose isolated Agent telemetry FTPS access'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify one-time read-only audit
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-telemetry-access.ready)" = 'PTSCPS_TELEMETRY_FTPS_ACCESS source=fb32bdfd93fe7b9ee2099557321d7d3d875acb98 readonly=1'
          python3 -m py_compile scripts/ptscps-agent-telemetry-access-audit.py
      - name: Check existing telemetry directory permissions (no log access)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-telemetry-access-audit.py
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-agent-telemetry-access-summary
          path: audit/ptscps-agent-telemetry-access-summary.json
          if-no-files-found: warn
          retention-days: 7
