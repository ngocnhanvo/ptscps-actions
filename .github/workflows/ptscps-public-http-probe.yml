name: PTSCPS post-deploy public HTTP diagnosis (read-only)
on:
  push:
    branches: [main]
    paths:
      - audit/ptscps-public-http-probe.ready
      - audit/ptscps-ftp-root-probe.ready
permissions:
  contents: read
jobs:
  public-http-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe only configured public PTSCPS endpoints, never deploy
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PYCODE'
          import os,re,ssl,time,urllib.error,urllib.request
          from urllib.parse import urlsplit
          vals={}
          for line in os.environ.get('ENV_FILE','').splitlines():
              m=re.match(r'^\s*(?:export\s+)?(WC_URL|WC_URL_CLIENT)\s*=\s*(.*)\s*$',line)
              if m: vals[m[1]]=m[2].strip().strip('\"\'')
          def parse(name):
              p=urlsplit(vals.get(name,''))
              if p.scheme!='https' or not p.hostname or p.path not in ('','/') or p.port not in (None,443) or p.query or p.fragment or p.username or p.password:
                  raise RuntimeError('Invalid configured '+name)
              return 'https://'+p.hostname
          cms,front=parse('WC_URL'),parse('WC_URL_CLIENT')
          if front==cms: raise RuntimeError('Overlapping WordPress and frontend origins')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ssl.create_default_context()), NoRedirect)
          def check(origin,path):
              req=urllib.request.Request(origin+path,headers={'User-Agent':'PTSCPS-public-smoke/1.0','Accept':'text/html,application/xml,*/*','Cache-Control':'no-cache'})
              try:
                  with opener.open(req,timeout=14) as res:
                      code=res.status; headers=res.headers; body=res.read(2000)
              except urllib.error.HTTPError as e:
                  code=e.code; headers=e.headers; body=e.read(2000)
              except Exception as e:
                  print('PUBLIC_PROBE='+str({'path':path,'site':'front' if origin==front else 'cms','network_error_type':type(e).__name__}))
                  return
              title=re.search(rb'<title[^>]*>([^<]{0,140})</title>',body,re.I)
              sample=(title.group(1).decode('utf-8','replace') if title else '')[:140]
              print('PUBLIC_PROBE='+str({'site':'front' if origin==front else 'cms','path':path,'http':code,'content_type':headers.get('Content-Type','')[:75],'location':headers.get('Location','')[:200],'title':sample}))
          for path in ('/','/trang-chu/','/index.html','/robots.txt','/sitemap.xml','/ptscps-staging-build.json','/client/index.html'):
              check(front,path)
          check(cms,'/wp-json/')
          time.sleep(2)
          check(front,'/')
          print('PTSCPS_PUBLIC_HTTP_DIAG=COMPLETE_READ_ONLY')
          PYCODE
      - name: Inspect configured frontend FTP docroot without modifying files
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import ftplib,os,re,ssl
          from urllib.parse import urlsplit
          config=os.environ.get('ENV_FILE','')
          m=re.findall(r'^\s*(?:export\s+)?WC_URL_CLIENT\s*=\s*(.*)$',config,re.M)
          if len(m)!=1: raise RuntimeError('Invalid WC_URL_CLIENT count')
          p=urlsplit(m[0].strip().strip('\"\''))
          if p.scheme!='https' or not p.hostname or p.path not in ('','/') or p.query or p.fragment or p.username or p.password or p.port not in (None,443):
              raise RuntimeError('Invalid frontend HTTPS origin')
          root='/domains/'+p.hostname+'/public_html'
          raw=os.environ['FTP_SERVER'].strip()
          if '://' not in raw:raw='ftp://'+raw
          address=urlsplit(raw)
          if address.scheme not in ('ftp','ftps') or not address.hostname or address.username or address.password or address.path.strip('/') or address.port not in (None,21):
              raise RuntimeError('Invalid FTPS destination')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=24)
          try:
              ftp.connect(address.hostname,address.port or 21)
              ftp.auth();ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']);ftp.prot_p()
              ftp.cwd(root)
              if ftp.pwd().rstrip('/') != root: raise RuntimeError('Unexpected FTPS docroot')
              ftp.voidcmd('TYPE I')
              results={}
              for name in ('.htaccess','index.html','client/index.html','server/entry.mjs','ecosystem.config.cjs','pm2-reload.txt','.env'):
                  try:
                      size=ftp.size(name)
                      results[name]='present' if size is not None else 'unknown'
                  except ftplib.error_perm as e:
                      if str(e).startswith('550'): results[name]='absent'
                      else:raise
              print('PTSCPS_FTPS_DOCROOT_FILES='+str(results))
              # Read only the small signed deployment provenance manifest to
              # distinguish an activation timeout from a completed activation.
              import json
              try:
                  size=ftp.size('ptscps-staging-build.json')
                  if size is None or size>16384: raise RuntimeError('Invalid deployment manifest size')
                  chunks=[]
                  ftp.retrbinary('RETR ptscps-staging-build.json',chunks.append)
                  raw_manifest=b''.join(chunks)
                  if len(raw_manifest)>16384: raise RuntimeError('Oversized deployment manifest')
                  manifest=json.loads(raw_manifest)
                  commit=manifest.get('commit','')
                  branch=manifest.get('branch','')
                  target=manifest.get('target','')
                  if not re.fullmatch(r'[a-f0-9]{40}',str(commit)) or branch!='master' or target!=p.hostname:
                      raise RuntimeError('Invalid published deployment provenance')
                  print('PTSCPS_FTPS_PUBLISHED_SOURCE='+str({'commit':commit,'branch':branch,'target_match':True}))
              except ftplib.error_perm as exc:
                  print('PTSCPS_FTPS_PUBLISHED_SOURCE='+str({'status':'missing' if str(exc).startswith('550') else 'ftp_error'}))
              try:
                  size=ftp.size('ptscps-astro.zip')
                  print('PTSCPS_FTPS_STAGED_ZIP='+str({'present':size is not None,'bytes':size}))
              except ftplib.error_perm as exc:
                  print('PTSCPS_FTPS_STAGED_ZIP='+str({'present':False if str(exc).startswith('550') else 'unknown'}))
              # Listing only: do not fetch/delete unpublished staging or backup files.
              try:
                  entries=[os.path.basename(v.rstrip('/')) for v in ftp.nlst()]
                  flags={kind:sum(name.startswith('.ptscps-unzip-'+kind+'-') for name in entries)
                         for kind in ('stage','backup')}
                  print('PTSCPS_FTPS_UNZIP_WORKDIR_COUNTS='+str(flags))
              except ftplib.all_errors as exc:
                  print('PTSCPS_FTPS_UNZIP_WORKDIR_COUNTS='+str({'warning_type':type(exc).__name__}))
              if results['.htaccess']=='present':
                  parts=[]
                  ftp.retrbinary('RETR .htaccess',parts.append)
                  blob=b''.join(parts)
                  if len(blob)>131072: raise RuntimeError('Oversized .htaccess')
                  text=blob.decode('utf8','replace').lower()
                  flags={key:bool(re.search(key,text)) for key in ('rewriteengine','rewriterule','directoryindex','proxy(pass|:|_)','passenger','sethandler','require all denied','options -indexes')}
                  print('PTSCPS_FTPS_HTACCESS_FLAGS='+str(flags))
              print('PTSCPS_FTPS_PROBE=PASS_READ_ONLY')
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PYCODE
