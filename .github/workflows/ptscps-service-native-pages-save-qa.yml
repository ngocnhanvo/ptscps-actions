name: PTSCPS native service Pages exact Save and restore QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ptscps-service-native-pages-save-qa.mjs'
      - '.github/workflows/ptscps-service-native-pages-save-qa.yml'
permissions:
  contents: read
concurrency:
  group: ptscps-native-service-page-save-qa
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ngocnhanvo/ptscps-actions'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve configured PTSCPS origins
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          vals={}
          for line in os.environ.get('ENV_FILE','').splitlines():
              m=re.fullmatch(r'\s*(?:export\s+)?(WC_URL|WC_URL_CLIENT)\s*=\s*(.*?)\s*',line)
              if m: vals[m[1]]=m[2].strip().strip('"\'')
          assert vals.get('WC_URL')=='https://admin-ptscps.thegioihosting.io.vn'
          assert vals.get('WC_URL_CLIENT')=='https://ptscps.thegioihosting.io.vn'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('WP_ORIGIN='+vals['WC_URL']+'\nCLIENT_ORIGIN='+vals['WC_URL_CLIENT']+'\n')
          PY
      - name: Install Playwright driver
        run: npm install --prefix .qa --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Validate scoped test script
        run: node --check scripts/ptscps-service-native-pages-save-qa.mjs
      - name: Verify native Page Save REST readback reload and exact restore
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-service-native-pages-save-qa.mjs
