name: PTSCPS EN second-service one-shot provider and retrieval trace
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-en-service-second-trace.ready]
permissions:
  contents: read
jobs:
  trace:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): trace EN second-service after DB-only ordinal fix'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate trace script
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-en-service-second-trace.ready)" = 'PTSCPS_EN_SECOND_TRACE source=a73b33da2f8fbf12d2e59c4d1f5aa8ada42733e1 cases=1'
          python3 -m py_compile scripts/ptscps-agent-en-service-second-trace.py
      - name: Trace exactly one EN second-service request
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-en-service-second-trace.py
      - name: Upload sanitized trace summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-en-second-service-trace
          path: audit/ptscps-agent-en-service-second-trace-summary.json
          if-no-files-found: warn
          retention-days: 7
