name: PTSCPS post DB-only ordinal eight-case factual QA
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-post-db-ordinal-eight-case.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-post-db-ordinal-eight-case
  cancel-in-progress: false
jobs:
  qa:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'test(ptscps): recheck eight ordinal facts after DB-only canonical fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact post-fix scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-post-db-ordinal-eight-case.ready)" = 'PTSCPS_POST_DB_ORDINAL source=a73b33da2f8fbf12d2e59c4d1f5aa8ada42733e1 cases=8'
          python3 -m py_compile scripts/ptscps-agent-fact-intent-grounded.py scripts/ptscps-agent-independent-fact-sample.py
          python3 scripts/ptscps-agent-independent-fact-sample.py --self-test
      - name: Evaluate eight previously failed second-and-last facts once
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: python3 scripts/ptscps-agent-independent-fact-sample.py
      - name: Upload sanitized aggregate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-post-db-ordinal-eight-case
          path: audit/ptscps-agent-independent-fact-summary.json
          if-no-files-found: warn
          retention-days: 7
