name: PTSCPS Groq Qwen compact Planner contract probe v2
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-groq-qwen-compact-v2-probe.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-groq-qwen-compact-v2-probe
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): retest compact Qwen Planner format'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: 222aec89067cc534e95f6a7665fc41798ac2024d
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Validate compact v2 provider-only QA
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-groq-qwen-compact-v2-probe.ready)" = 'PTSCPS_GROQ_QWEN_COMPACT_V2 source=222aec89067cc534e95f6a7665fc41798ac2024d cases=6 model=qwen/qwen3.8-27b'
          python3 -m py_compile scripts/ptscps-agent-groq-qwen-compact-probe.py
          php -l scripts/ptscps-agent-compact-planner-helper.php
      - name: Retest compact Planner field contract on Qwen 3.8
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-groq-qwen-compact-probe.py
      - name: Upload sanitized compact v2 Planner summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-groq-qwen-compact-v2-planner-probe
          path: audit/ptscps-agent-groq-qwen-compact-probe-summary.json
          if-no-files-found: warn
          retention-days: 7
