name: PTSCPS RAG RUN03 guarded PHP retrieval and read-only top-5 QA
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-rag-run03-readonly.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  release-and-measure:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): guarded RUN03 read-only retrieval QA PHP only'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: 871602cd650aade4d3b996c63003deff49ed1458
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/source-commit-actions
          ref: main
          path: source-control
          persist-credentials: false
      - name: Verify pinned PHP source and read-only regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-rag-run03-readonly.ready)" = 'PTSCPS_RUN03_READ_ONLY source=871602cd650aade4d3b996c63003deff49ed1458'
          test "$(git -C source-php rev-parse HEAD)" = '871602cd650aade4d3b996c63003deff49ed1458'
          grep -Fq 'PTSCPS_AGENT_KNOWLEDGE_ONLY' scripts/ptscps-php-live-release.py
          for file in wp-content/mu-plugins/esc-agent.php \
            wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeInventory.php \
            wp-content/mu-plugins/esc-agent/src/Knowledge/KnowledgeIndex.php; do
            php -l "source-php/$file"
          done
          php source-php/wp-content/mu-plugins/tests/esc-agent-retrieval-readonly-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-source-locale-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py
          node --check scripts/ptscps-agent-rag-run03-readonly.mjs
      - name: Guarded PHP-only FTPS release with readback/rollback
        env:
          PTSCPS_AGENT_KNOWLEDGE_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Measure live top-5 and locale isolation, without CMS writes or LLM calls
        env:
          PTSCPS_SOURCE_SHA: 871602cd650aade4d3b996c63003deff49ed1458
          ENV_FILE: ${{ secrets.ENV_FILE }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/ptscps-agent-rag-run03-readonly.mjs
      - name: Upload sanitized aggregate and encrypted private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-rag-run03-readonly
          path: |
            audit/ptscps-agent-rag-run03-summary.json
            audit/ptscps-agent-rag-run03-private.cms
          if-no-files-found: warn
          retention-days: 14
