name: PTSCPS bounded provider cooldown and failover trace
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-provider-cooldown-trace.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-provider-cooldown-trace
  cancel-in-progress: false
jobs:
  trace:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): trace bounded provider cooldown sequence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate bounded trace scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-provider-cooldown-trace.ready)" = 'PTSCPS_PROVIDER_COOLDOWN_TRACE source=a73b33da2f8fbf12d2e59c4d1f5aa8ada42733e1 cases=3'
          python3 -m py_compile scripts/ptscps-agent-provider-cooldown-trace.py scripts/ptscps-agent-client-routing-trace.py scripts/ptscps-agent-independent-fact-sample.py
      - name: Trace exactly three sequential source-grounded requests
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-provider-cooldown-trace.py
      - name: Upload sanitized provider-health summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-provider-cooldown-trace
          path: audit/ptscps-agent-provider-cooldown-trace-summary.json
          if-no-files-found: warn
          retention-days: 7
