name: PTSCPS Agent LLM error display browser acceptance (read-only)
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-error-display-qa.ready]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'test(ptscps): verify real LLM errors appear on live UI'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm pinned Astro production and test source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-error-display-qa.ready)" = 'PTSCPS_AGENT_ERROR_UI source=28ae46057de761bc3ae8c4a2a3abe660a6043e1a mode=read-only'
          node --check scripts/ptscps-agent-error-display-qa.mjs
      - name: Install Playwright driver (Chromium preinstalled)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify synthetic LLM 503 is shown as error in VI and EN chat
        env:
          FRONTEND_ORIGIN: https://ptscps.thegioihosting.io.vn
        run: node scripts/ptscps-agent-error-display-qa.mjs
