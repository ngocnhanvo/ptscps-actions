name: PTSCPS sanitized Gemini auth and model diagnostic
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-gemini-auth-diagnostic.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-gemini-auth-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): classify Gemini fallback HTTP 400'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-gemini-auth-diagnostic.ready)" = 'PTSCPS_GEMINI_AUTH_DIAGNOSTIC source=a73b33da2f8fbf12d2e59c4d1f5aa8ada42733e1 requests=3'
          python3 -m py_compile scripts/ptscps-agent-gemini-auth-diagnostic.py
      - name: Classify Gemini HTTP 400 without Agent traffic
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-gemini-auth-diagnostic.py
      - name: Upload sanitized diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-gemini-auth-diagnostic
          path: audit/ptscps-agent-gemini-auth-diagnostic-summary.json
          if-no-files-found: warn
          retention-days: 7
