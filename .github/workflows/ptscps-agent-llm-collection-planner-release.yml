name: PTSCPS Agent LLM collection Planner guarded PHP release
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-llm-collection-planner.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  guarded-planner-prompt:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): LLM Planner published collection prompt PHP only'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: cb612e024a946b3d87b775a31f8ca70a48aae331
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify pinned source and actual Planner contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-llm-collection-planner.ready)" = 'PTSCPS_AGENT_PLANNER_PROMPT source=cb612e024a946b3d87b775a31f8ca70a48aae331'
          test "$(git -C source-php rev-parse HEAD)" = 'cb612e024a946b3d87b775a31f8ca70a48aae331'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Core/Planner.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-collection-planner-contract-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-llm-fail-closed-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-routing-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py
      - name: Release Planner.php only through guarded FTPS and verify remote SHA-256
        env:
          PTSCPS_AGENT_PLANNER_PROMPT_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
