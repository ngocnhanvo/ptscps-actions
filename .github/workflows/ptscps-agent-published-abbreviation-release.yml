name: PTSCPS Agent verified abbreviation PHP-only production release
on:
  push:
    branches: [main]
    paths:
      - audit/ptscps-agent-published-abbreviation-release.ready
permissions:
  contents: read
concurrency:
  group: ptscps-wp-php-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'deploy(ptscps): guarded grounded acronym PHP'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout Actions scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned PHP source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: Verify source and abbreviation regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-published-abbreviation-release.ready)" = 'PTSCPS_AGENT_PUBLISHED_ABBREVIATION_RELEASE source=7ffe40686920afd7357c2b31298b950b91f34b87 mode=php-only'
          test "$(git -C source-php rev-parse HEAD)" = '7ffe40686920afd7357c2b31298b950b91f34b87'
          php -l source-php/wp-content/mu-plugins/esc-agent/src/Core/KnowledgeAwarePlanner.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-abbreviation-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-published-routing-test.php
          php source-php/wp-content/mu-plugins/tests/esc-agent-complete-collection-summary-test.php
          python3 -m py_compile scripts/ptscps-php-live-release.py
          grep -Fq 'PTSCPS_AGENT_PUBLISHED_ROUTING_ONLY' scripts/ptscps-php-live-release.py
      - name: Atomic one-file PHP release with SHA-256 readback
        shell: bash
        env:
          PTSCPS_AGENT_PUBLISHED_ROUTING_ONLY: '1'
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-php-live-release.py
      - name: Focused real-site VI EN acronym acceptance
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PYCODE'
          import json,os,re,uuid
          from urllib.parse import urlsplit
          from urllib.request import Request,urlopen
          rows = {}
          for line in os.environ['ENV_FILE'].splitlines():
              if line.strip().startswith('export '): line=line.strip()[7:]
              if '=' in line:
                  key,value=line.split('=',1)
                  rows[key.strip()]=value.strip().strip('"\'')
          u=urlsplit(rows.get('WC_URL_CLIENT',''))
          assert u.scheme=='https' and u.hostname=='ptscps.thegioihosting.io.vn' and u.path in ('','/') and not u.query
          endpoint=u.scheme+'://'+u.netloc+'/api/agent/chat'
          for language,question in [('vi','pps là gì'),('en','What is PPS?')]:
              data=json.dumps({'message':question,'language':language,'sessionId':str(uuid.uuid4())}).encode()
              req=Request(endpoint,data=data,headers={'Content-Type':'application/json'},method='POST')
              with urlopen(req,timeout=90) as result:
                  status=result.status
                  answer=json.load(result).get('reply','')
              normalized=re.sub(r'\s+',' ',answer).strip().upper()
              correct='PTSC PRODUCTION SERVICES JSC' in normalized and 'PPS' in normalized
              wrong='POWERPOINT' in normalized or 'POWERPOINT SHOW' in normalized
              print('PTSCPS_ABBREVIATION_LIVE',json.dumps({'locale':language,'http':status,'company_match':correct,'wrong_expansion':wrong,'chars':len(answer)}))
              if status!=200 or not correct or wrong:
                  raise SystemExit(1)
          print('PTSCPS_ABBREVIATION_LIVE=PASS 2/2')
          PYCODE
      - name: Confirm PHP-only release
        run: echo PTSCPS_ABBREVIATION_PHP_ONLY=PASS
