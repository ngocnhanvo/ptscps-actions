name: PTSCPS Agent LLM error attribution (read-only)
on:
  push:
    branches: [main]
    paths: [audit/ptscps-agent-llm-runtime-trace.ready]
permissions:
  contents: read
concurrency:
  group: ptscps-agent-llm-observe
  cancel-in-progress: false
jobs:
  inspect:
    if: >-
      github.repository == 'ngocnhanvo/ptscps-actions'
      && github.event.head_commit.message == 'audit(ptscps): capture LLM failure metadata without deploying'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check one-time source scope and script syntax
        run: |
          set -euo pipefail
          test "$(cat audit/ptscps-agent-llm-runtime-trace.ready)" = 'PTSCPS_AGENT_LLM_OBSERVE source=0d9080acae3a2059ca79ddd84c37025b76b5b619 mode=readonly'
          python3 -m py_compile scripts/ptscps-agent-llm-runtime-trace.py
      - name: Read-only isolated VI/EN LLM requests and private telemetry
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ptscps-agent-llm-runtime-trace.py
      - name: Preserve sanitized metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-agent-llm-runtime-trace
          path: audit/ptscps-agent-llm-runtime-trace-result.json
          if-no-files-found: warn
          retention-days: 7
